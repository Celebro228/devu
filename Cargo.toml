[package]
name = "devu"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Simple raylib-based game engine for Rust"
repository = "https://github.com/Celebro228/devu"
documentation = "https://docs.rs/devu"
keywords = ["gamedev", "webassembly", "3d", "graphics"]
categories = ["game-development", "graphics", "rendering"]
authors = ["Celebro228"]


[dependencies]
raylib = { git = "https://github.com/raylib-rs/raylib-rs.git", package = "raylib", rev = "c574449e65d698d7bee1e7d623726f83947a2c13" }
shipyard = "0.11.0"
glam = "0.30.10"


# Release mod
[profile.release]
lto = true
panic = "abort"
debug = false
opt-level = 3
overflow-checks = false
debug-assertions = false
incremental = false
rpath = false
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = 3